[package]
name = "herdr-baa"
version = "0.1.0"
edition = "2024"
# `File::try_lock` is stable since 1.89.
rust-version = "1.89"
description = "Herdr plugin: uh-oh or all good. Shows next to each agent whether its project still compiles."
license = "Apache-2.0"
repository = "https://github.com/rsdlt/baa"
readme = "README.md"
keywords = ["herdr", "plugin", "agents", "terminal"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["/assets"]

[[bin]]
name = "baa"
path = "src/main.rs"

[dependencies]
libc = "0.2.190"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde", "std"] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
strip = true
